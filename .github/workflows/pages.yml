name: Publicar y actualizar Radar BORA

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-bora-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construir sitio
        run: node scripts/build-github.mjs
      - name: Actualizar normativa del BORA
        run: node scripts/update-github-feed.mjs
      - name: Guardar actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/feed.json
          git diff --cached --quiet || git commit -m "Actualizar Radar BORA [skip ci]"
          git pull --rebase origin main
          git push

